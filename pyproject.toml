[project]
name = "milesight-mcp"
version = "0.1.0"
description = "MCP server for the Milesight LoRaWAN gateway HTTP API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Stefan Knaak", email = "stefan@knaak.org" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lorawan", "milesight", "mcp", "fastmcp", "iot", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/corgan2222/milesight-mcp"
Repository = "https://github.com/corgan2222/milesight-mcp"
Issues = "https://github.com/corgan2222/milesight-mcp/issues"

[project.scripts]
milesight-mcp = "milesight_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milesight_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
